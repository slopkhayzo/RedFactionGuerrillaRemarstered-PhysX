; rfgphys settings (release). Any key can also be set with an environment variable RFGPHYS_<SECTION>_<KEY>.

[General]
; 0 turns the mod off: the game runs as it ships.
Enabled=1
; Each game session writes rfgphys.log and physx_host.log into a folder of its own, under this folder
; (empty: scripts\rfgphys_runs next to this file). Only the newest KeepSessions folders are kept (0: all).
OutputDir=
KeepSessions=10
; A gameplay frame still running after this many seconds while a game thread is busy ends the game with a hang
; report in rfgphys.log, instead of a frozen window (0: off).
HangSeconds=30

[Telemetry]
; Frame timing and object census files for development (about 80 KB per second of play).
Enabled=0

[Profiler]
; Sampling profiler for development (needs Telemetry).
Enabled=0

[Experiment]
; Never applied in multiplayer.
; DebrisCollide: 1 debris collides with debris, 2 it also damages and breaks up debris, 0 the game's behaviour.
DebrisCollide=2
SolverBufferMB=16
; GpuOcclusion: 0 turns off the game's GPU occlusion queries (more FPS in heavy scenes), 1 the game's default.
GpuOcclusion=0
; Objects smaller than this radius (cm) cast no shadow into the far / mid / near shadow cascade (0: the game's).
ShadowMinRadiusFarCm=200
ShadowMinRadiusMidCm=50
ShadowMinRadiusNearCm=0
; HavokThreads: Havok worker threads besides the game's own (-1: by the processor, 1 to 5; 0: the game's single
; thread; at most 11).
HavokThreads=-1
; KeepDebris: the game no longer removes debris. DebrisPool, RenderInstances and HavokHeapMB raise the game's limits
; for it; ZoneReserve keeps object handles free in each world zone (the farthest debris is recycled below it).
; RenderInstances: 65,000 at most (the game numbers them with 16 bits). HavokHeapMB: the game's physics memory, taken
; whole out of the game's own memory, which is short (the game is a 32-bit program: 4 GB of address space). With the
; debris in PhysX, Havok used at most 125 MB in the heaviest tests and under 64 MB in long sessions.
KeepDebris=1
DebrisPool=32768
RenderInstances=65000
HavokHeapMB=256
ZoneReserve=1200
; PhysX: debris pieces move in NVIDIA PhysX 5 in a separate process (scripts\rfgphysx). 1: on the GPU (NVIDIA GTX 16 /
; RTX 20 series or newer; otherwise on the CPU), 2: on the CPU, 0: off (debris stays in the game's Havok).
; PhysXRate: its steps per second. Each step covers a fixed time, and in the heaviest moments, when a step takes longer
; than that, the debris moves in slow motion; with fewer steps that happens much less (60: smoother contacts, more
; slow motion). PhysXWorld / PhysXDebris: the level's static world and the debris go there.
PhysX=1
PhysXRate=45
PhysXWorld=1
PhysXDebris=1
; PhysXMaxBodies: the most pieces PhysX keeps (about 125,000 is the suggested most; 262,144 at most); past it the
; farthest from the player go. More needs more graphics memory (a whole levelled map of 260,000 pieces took about
; 20 GB) and more of the game's own memory: about 0.4 KB a slot, used or not. On big maps a high value leaves the game
; too little: it stops drawing, crashes or fails with "CreateTexture2D failed with error code 0x8007000e". The session
; log shows what is left ("address space").
PhysXMaxBodies=65536
; PhysXAdoptDelayMs: a new piece stays in the game's Havok this long before it goes to PhysX, so the pieces a blast
; throws still break what they hit and weigh on what they land on, as the game's own debris does (0: at once).
; PhysXWorldOnlyAtOnce: the game's "world-only" pieces (every small one in Wrecking Crew), which meet nothing but the
; ground and characters in Havok, go at once: while they waited they sank into buildings they lay on, and PhysX then
; pushed them out underneath.
PhysXAdoptDelayMs=2000
PhysXWorldOnlyAtOnce=1
; BatchedCap: room for this many instanced objects drawn per frame (the game: 24,576; loose debris can need more).
BatchedCap=131072
; UnbatchedCap: room for this many objects drawn one by one in a pass, piles and buildings among them (the game: 4,096,
; and what does not fit is not drawn that frame; a levelled map's overview needs up to about 6,000).
UnbatchedCap=16384
; PhysXSolidDebris: pieces of PhysXSolidMassKg or more are solid to the player (you stand on rubble); lighter ones
; are pushed aside.
PhysXSolidDebris=1
PhysXSolidMassKg=40
; PhysXDebrisPiles: debris at rest is drawn in piles, the resting pieces of one building lying close together as one
; mesh, as a standing building is (many more FPS with a lot of debris in view); a piece knocked loose leaves its pile.
PhysXDebrisPiles=1
; PhysXChunks: loose parts of buildings (the top of a building shot out from under itself, and the sections it breaks
; into) move in PhysX too: they land on the rubble and on each other and break as they hit. 0: the game's Havok.
PhysXChunks=1
; How they break (0 turns each off). PhysXChunkBreakKN: the load in kN past which a part breaks off.
; PhysXChunkCrushJPerKg: what breaking a part takes from the chunk's motion, per kg of it (less: it crushes further).
; PhysXChunkCrackPercent: the share of what a chunk loses in a hit that cracks it into sections along its weakest links.
; PhysXChunkMaterials: 1 parts break by what the game says they are made of, glass first and steel last; 0 all alike.
; PhysXChunkStumpPercent: what a building loses where a chunk lands on it, against what the chunk loses.
; PhysXChunkSnapMrad: how readily a big chunk held at one end snaps under its own weight.
; PhysXChunkRestStrength: how many times more load a part takes when what presses on it is hardly moving.
; PhysXChunkCrushAtContact: 1 crushing pushes where the parts break, so chunks tip and turn aside; 0 it only slows them.
PhysXChunkBreakKN=50
PhysXChunkCrushJPerKg=250
PhysXChunkCrackPercent=3
PhysXChunkMaterials=1
PhysXChunkStumpPercent=100
PhysXChunkSnapMrad=20
PhysXChunkRestStrength=6
PhysXChunkCrushAtContact=1

[FlyCamera]
; Free camera for screenshots (development; single player). With Enabled=1, Key (a Windows virtual-key code, 121 = F10)
; takes the view off the game camera, and gives it back as it was. W/S/A/D move along the view, Space/Ctrl up and
; down, Q/E roll, the mouse or the arrow keys turn, Shift moves faster, Alt slower, the mouse wheel zooms and the
; middle mouse button resets the zoom. Meanwhile the game gets no input (the player stands still) and the HUD is
; hidden (HideHud=0 keeps it). Speed: metres per second; LookSpeed: turning speed in percent.
Enabled=0
Key=121
Speed=10
LookSpeed=100
HideHud=1

[Harness]
; Record and replay (development only).
Mode=off
